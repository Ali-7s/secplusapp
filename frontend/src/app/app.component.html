<a href="#main-content" class="skip-link">Skip to main content</a>

<mat-sidenav-container class="app-container">
  <mat-sidenav #sidenav mode="over" class="app-sidenav" role="navigation" aria-label="Main navigation">
    <div class="sidenav-header">
      <mat-icon class="logo-icon" aria-hidden="true">shield</mat-icon>
      <div>
        <div class="logo-title">Security+</div>
        <div class="logo-sub">SY0-701 Study Platform</div>
      </div>
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a mat-list-item [routerLink]="item.path" routerLinkActive="active-link" (click)="sidenav.close()">
          <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>

    <div class="sidenav-bottom">
      <div class="theme-pick" role="group" aria-label="Theme">
        @for (t of themes; track t.mode) {
          <button type="button" [class.on]="theme.mode() === t.mode" [attr.aria-pressed]="theme.mode() === t.mode" (click)="theme.set(t.mode)">
            <mat-icon aria-hidden="true">{{ t.icon }}</mat-icon>{{ t.label }}
          </button>
        }
      </div>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="app-toolbar" color="primary" role="banner">
      <button mat-icon-button (click)="sidenav.toggle()" class="menu-btn" aria-label="Open navigation menu" aria-haspopup="dialog">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
      <a class="toolbar-brand" routerLink="/" aria-label="Security+ SY0-701 — go to the home page">
        <mat-icon aria-hidden="true">shield</mat-icon>
        <span class="brand-text">Security+ SY0-701</span>
      </a>
      <span class="toolbar-spacer"></span>

      <nav class="desktop-nav" aria-label="Primary">
        @for (item of navItems; track item.path) {
          <a mat-button [routerLink]="item.path" routerLinkActive="active-nav">
            <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon> {{ item.short }}
          </a>
        }
      </nav>

      <button mat-icon-button class="theme-btn" (click)="theme.cycle()"
        [attr.aria-label]="'Theme: ' + theme.current().label + '. Switch to ' + theme.next().label" [attr.title]="'Switch to ' + theme.next().label + ' theme'">
        <mat-icon aria-hidden="true">{{ theme.current().icon }}</mat-icon>
      </button>
    </mat-toolbar>

    <main class="app-content" id="main-content" tabindex="-1">
      <router-outlet></router-outlet>
    </main>

    <app-back-to-top />
  </mat-sidenav-content>
</mat-sidenav-container>

<!-- Escape covers the app with a plain search page; Escape again brings it back. -->
<app-cover />
